<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="704" viewBox="0 0 1200 704" role="img" aria-labelledby="script-workflow-agent-title script-workflow-agent-desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="script-workflow-agent-title">Script, workflow or agent: a three-question decision tree</title>
  <desc id="script-workflow-agent-desc">Decision tree with three questions. First: are the steps fixed, with no judgment needed? If yes, use a plain script: cron plus code, no LLM. If no, second: are the steps known, but each needs language skill? If yes, use an LLM workflow: code drives, with an LLM call per step. If no, third: does the next step depend on what was just found? If yes, use an AI agent: the LLM drives, with limits. If no, re-scope, because the job is not clear yet.</desc>
  <defs>
    <marker id="script-workflow-agent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="1200" height="704" fill="#ffffff"/>
  <text x="40" y="52" font-size="26" font-weight="600" fill="#111827" dominant-baseline="central">Three questions decide between a script, a workflow and an agent</text>
  <polygon points="560,110 780,180 560,250 340,180" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="560" y="168.5" font-size="17" fill="#111827" text-anchor="middle" dominant-baseline="central">Are the steps fixed</text>
  <text x="560" y="191.5" font-size="17" fill="#111827" text-anchor="middle" dominant-baseline="central">and no judgment needed?</text>
  <rect x="900" y="138" width="260" height="84" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="1030" y="167" font-size="18" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="central">Plain script</text>
  <text x="1030" y="194.5" font-size="15" fill="#4b5563" text-anchor="middle" dominant-baseline="central">cron + code, no LLM</text>
  <path d="M780,180 L898,180" fill="none" stroke="#6b7280" stroke-width="1.75" stroke-linejoin="round" marker-end="url(#script-workflow-agent-arrow)"/>
  <rect x="822.98" y="153" width="34.03" height="22" rx="4" fill="#ffffff"/>
  <text x="840" y="164" font-size="14" fill="#6b7280" text-anchor="middle" dominant-baseline="central">yes</text>
  <polygon points="560,314 780,384 560,454 340,384" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="560" y="372.5" font-size="17" fill="#111827" text-anchor="middle" dominant-baseline="central">Steps known, but each</text>
  <text x="560" y="395.5" font-size="17" fill="#111827" text-anchor="middle" dominant-baseline="central">needs language skill?</text>
  <rect x="900" y="342" width="260" height="84" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="1030" y="371" font-size="18" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="central">LLM workflow</text>
  <text x="1030" y="398.5" font-size="15" fill="#4b5563" text-anchor="middle" dominant-baseline="central">code drives, LLM per step</text>
  <path d="M780,384 L898,384" fill="none" stroke="#6b7280" stroke-width="1.75" stroke-linejoin="round" marker-end="url(#script-workflow-agent-arrow)"/>
  <rect x="822.98" y="357" width="34.03" height="22" rx="4" fill="#ffffff"/>
  <text x="840" y="368" font-size="14" fill="#6b7280" text-anchor="middle" dominant-baseline="central">yes</text>
  <polygon points="560,518 780,588 560,658 340,588" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="560" y="576.5" font-size="17" fill="#111827" text-anchor="middle" dominant-baseline="central">Does the next step depend</text>
  <text x="560" y="599.5" font-size="17" fill="#111827" text-anchor="middle" dominant-baseline="central">on what was just found?</text>
  <rect x="900" y="546" width="260" height="84" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="1030" y="575" font-size="18" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="central">AI agent</text>
  <text x="1030" y="602.5" font-size="15" fill="#4b5563" text-anchor="middle" dominant-baseline="central">LLM drives, with limits</text>
  <path d="M780,588 L898,588" fill="none" stroke="#6b7280" stroke-width="1.75" stroke-linejoin="round" marker-end="url(#script-workflow-agent-arrow)"/>
  <rect x="822.98" y="561" width="34.03" height="22" rx="4" fill="#ffffff"/>
  <text x="840" y="572" font-size="14" fill="#6b7280" text-anchor="middle" dominant-baseline="central">yes</text>
  <path d="M560,250 L560,312" fill="none" stroke="#6b7280" stroke-width="1.75" stroke-linejoin="round" marker-end="url(#script-workflow-agent-arrow)"/>
  <rect x="567" y="271" width="27.42" height="22" rx="4" fill="#ffffff"/>
  <text x="572" y="282" font-size="14" fill="#6b7280" dominant-baseline="central">no</text>
  <path d="M560,454 L560,516" fill="none" stroke="#6b7280" stroke-width="1.75" stroke-linejoin="round" marker-end="url(#script-workflow-agent-arrow)"/>
  <rect x="567" y="475" width="27.42" height="22" rx="4" fill="#ffffff"/>
  <text x="572" y="486" font-size="14" fill="#6b7280" dominant-baseline="central">no</text>
  <rect x="40" y="546" width="220" height="84" rx="10" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="150" y="575" font-size="18" font-weight="600" fill="#111827" text-anchor="middle" dominant-baseline="central">Re-scope</text>
  <text x="150" y="602.5" font-size="15" fill="#4b5563" text-anchor="middle" dominant-baseline="central">the job is not clear yet</text>
  <path d="M340,588 L262,588" fill="none" stroke="#6b7280" stroke-width="1.75" stroke-linejoin="round" marker-end="url(#script-workflow-agent-arrow)"/>
  <rect x="286.29" y="561" width="27.42" height="22" rx="4" fill="#ffffff"/>
  <text x="300" y="572" font-size="14" fill="#6b7280" text-anchor="middle" dominant-baseline="central">no</text>
</svg>
